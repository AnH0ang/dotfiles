# set prefix to Ctrl-a
set -g prefix C-a
unbind C-b
bind-key C-a send-keys C-a

# reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded..."

# Set entry shell
set-option -g default-shell /home/user/.local/share/mise/installs/aqua-fish-shell-fish-shell/latest/fish

# options
set-option -g history-limit 100000
set-option -g base-index 1
set-option -g set-titles on
set-option -g renumber-windows on

# vi mode
set -g status-keys vi
setw -g mode-keys vi

# open new windows in pwd
bind c new-window -c "#{pane_current_path}"

# smart pane switching with awareness of vim splits
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# split panes using | and -
bind | split-window -h
bind - split-window -v
bind _ split-window -v
unbind '"'
unbind %

# no confirmation
bind-key x kill-pane

# vim "keys" in select mode
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

# Enable mouse mode (tmux 2.1 and above)
set -g mouse on


# copy mode
setw -g mode-style 'fg=black bg=green bold'

# panes
set -g pane-border-style 'fg=green'
set -g pane-active-border-style 'fg=yellow'

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=green'

set -g status-left ''
set -g status-left-length 10

setw -g window-status-current-style 'fg=black bg=green'
setw -g window-status-current-format ' #I #W #F '

setw -g window-status-style 'fg=green bg=black'
setw -g window-status-format ' #I #W #F '

set -g message-style 'fg=yellow bg=green bold'
